name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public files
        run: python -X utf8 scripts/audit-public-release.py
      - name: Fresh install defaults
        run: python -X utf8 -m unittest discover -s scripts/tests -p test_fresh_install.py -v
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Package portable app
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: CodexControlCenter-Windows-x64
          path: CodexControlCenter-Windows-x64.zip
